name: watch

# Fails, and so emails the repository owner, when production is down, a hot wallet the app spends from
# (drip, scorer, liquidator) is below its floor, or the spot books' maker has stopped: its gas is low or the last
# `seed` run failed. Judges arrive in bursts; an empty drip stops every join, and an eaten ladder every spot trade.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # Reads the last `seed` run's result.
  actions: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Production health and hot wallets
        run: |
          body=$(curl -sS --max-time 30 --retry 3 --retry-delay 10 https://app.yotrade.xyz/api/health)
          echo "$body" | jq .
          echo "$body" | jq -e '.status == "ok"' > /dev/null || { echo "::error::production is not healthy"; exit 1; }
          low=$(echo "$body" | jq -r '.attention | join(", ")')
          if [ -n "$low" ]; then
            echo "::error::top up: $low"
            exit 1
          fi
      - name: Spot books' maker
        env:
          GH_TOKEN: ${{ github.token }}
          MAKER: "0x4E9D7d61957A2536815948b743F33FDC45165E64"
          # A run that re-places both ladders spends about 0.4 MON; below this the next one may not finish.
          FLOOR_WEI: "500000000000000000"
        run: |
          hex=$(curl -sS --max-time 30 --retry 3 --retry-delay 10 https://testnet-rpc.monad.xyz \
            -H 'content-type: application/json' \
            -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_getBalance\",\"params\":[\"$MAKER\",\"latest\"]}" | jq -r .result)
          wei=$(python3 -c "print(int('$hex', 16))")
          echo "maker $MAKER: $(python3 -c "print($wei / 1e18)") MON"
          failed=0
          # Wei overflows shell arithmetic above about 9.2 MON, so python compares.
          if [ "$(python3 -c "print(int($wei < $FLOOR_WEI))")" = 1 ]; then
            echo "::error::top up the maker $MAKER"
            failed=1
          fi
          last=$(gh run list -R "$GITHUB_REPOSITORY" --workflow seed.yml --limit 1 --json conclusion --jq '.[0].conclusion')
          echo "last seed run: $last"
          if [ "$last" = "failure" ]; then
            echo "::error::the last seed run failed"
            failed=1
          fi
          exit $failed
