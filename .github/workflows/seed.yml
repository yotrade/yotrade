name: seed

# Rests the maker's two-sided ladder on the Kuru testnet books, so spot tournaments always have something to
# trade against. Daily, because the faucet that funds the inventory can be claimed once a day, and on demand.
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

concurrency: seed

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run seed --execute
        working-directory: packages/plugins/plugin-kuru
        env:
          MAKER_PRIVATE_KEY: ${{ secrets.MAKER_PRIVATE_KEY }}
