name: seed

# Rests the maker's two-sided ladder on the Kuru testnet books, so spot tournaments always have something to
# trade against. Every six hours, so a ladder eaten by a busy afternoon is back before the evening; the faucet
# that funds the inventory can be claimed once a day. Also on demand.
on:
  schedule:
    - cron: "0 1,7,13,19 * * *"
  workflow_dispatch:

concurrency: seed

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run seed --execute
        working-directory: packages/plugins/plugin-kuru
        env:
          MAKER_PRIVATE_KEY: ${{ secrets.MAKER_PRIVATE_KEY }}
