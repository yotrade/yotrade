name: liquidate

# Liquidates futures accounts under their maintenance margin in every running tournament. Anyone may, and
# rivals are motivated to; this makes sure it happens even when nobody is watching, which matters at 100x.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency: liquidate

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  liquidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run liquidate --execute
        working-directory: packages/plugins/plugin-perps
        env:
          LIQUIDATOR_PRIVATE_KEY: ${{ secrets.LIQUIDATOR_PRIVATE_KEY }}
          PYTH_API_KEY: ${{ secrets.PYTH_API_KEY }}
