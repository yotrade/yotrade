[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.37"
# Foundry >= 1.8: execute with Monad's gas model, opcode pricing, precompiles and size limits.
network = "monad"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
use_literal_content = true
fs_permissions = [{ access = "read", path = "./" }]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 64
depth = 128
fail_on_revert = false

[profile.ci.fuzz]
runs = 2048

[profile.ci.invariant]
runs = 256
depth = 256

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
sort_imports = true

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC_URL}"

[etherscan]
monad_testnet = { key = "${ETHERSCAN_API_KEY}", chain = 10143, url = "https://api.etherscan.io/v2/api?chainid=10143" }
