enum TournamentStatus {
  OPEN
  RESULTS_POSTED
  CANCELLED
}

type Tournament {
  id: ID!
  organizer: String! @index
  venue: String!
  prizeToken: String!
  capitalToken: String!
  prizePool: BigInt!
  startingCapital: BigInt!
  startTime: BigInt! @index
  endTime: BigInt! @index
  maxParticipants: Int!
  allowlisted: Boolean!
  prizeSplitBps: [Int!]!
  metadataURI: String!
  status: TournamentStatus! @index
  participantCount: Int!
  "Addresses ranked best first, as posted. Empty until results are posted and after they are voided."
  winners: [String!]!
  "Zero until results are posted."
  claimableAt: BigInt!
  prizesClaimed: BigInt!
  returnedToOrganizer: BigInt!
  createdAt: BigInt!
  createdTx: String!
  entries: [Entry!]! @derivedFrom(field: "tournament")
}

type Entry {
  "<tournamentId>-<participant>"
  id: ID!
  tournament: Tournament!
  participant: Trader!
  "The venue account the scorer reads trades and balances from."
  tradingAccount: String! @index
  "Free capital recorded at join: the ROI denominator."
  capitalAtJoin: BigInt!
  joinedAt: BigInt!
  "One-based. Null until results are posted and after they are voided."
  rank: Int
  prize: BigInt!
  claimed: Boolean!
  "Futures only: fills so far, the cash balance after the last one, and how the account ended."
  perpsFills: Int!
  perpsBalance: BigInt
  liquidated: Boolean!
  settled: Boolean!
  fills: [Fill!]! @derivedFrom(field: "entry")
  "Spot only: money that reached the trading account after the join and by the end. Part of the ROI denominator."
  capitalIn: [CapitalIn!]! @derivedFrom(field: "entry")
}

"A Kuru AccountCore id and the address it belongs to."
type KuruAccount {
  "AccountCore id"
  id: ID!
  account: String! @index
}

"A deposit or internal transfer into a spot entry's trading account between its join and the end."
type CapitalIn {
  "<tx hash>-<log index>-<entry id>"
  id: ID!
  entry: Entry! @index
  tournament: Tournament! @index
  token: String!
  "Raw token units"
  amount: BigInt!
  timestamp: BigInt!
  tx: String!
}

"One fill on the futures venue."
type Fill {
  "<tx hash>-<log index>"
  id: ID!
  entry: Entry! @index
  tournament: Tournament! @index
  trader: Trader! @index
  "Pyth feed id"
  market: String! @index
  "Signed base units, 1e18"
  sizeDelta: BigInt!
  "USD 1e18"
  price: BigInt!
  realizedPnl: BigInt!
  fee: BigInt!
  newSize: BigInt!
  balance: BigInt!
  timestamp: BigInt! @index
  tx: String!
}

type Liquidation {
  "<tx hash>-<log index>"
  id: ID!
  entry: Entry! @index
  tournament: Tournament! @index
  liquidator: String!
  "Cash after the liquidation, floored at zero"
  balance: BigInt!
  timestamp: BigInt!
}

"A Pyth feed the futures venue accepts."
type PerpsMarket {
  "Pyth feed id"
  id: ID!
  enabled: Boolean!
}

type Trader {
  "Participant address"
  id: ID!
  "From ProfileRegistry. Untrusted text: render as text, never as HTML."
  name: String!
  "Kit avatar id; zero means none"
  avatar: Int!
  tournamentsJoined: Int!
  podiums: Int!
  wins: Int!
  totalPrize: BigInt!
  entries: [Entry!]! @derivedFrom(field: "participant")
}

type Stats {
  "Always 'global'"
  id: ID!
  tournaments: Int!
  entries: Int!
  traders: Int!
  prizesEscrowed: BigInt!
  prizesClaimed: BigInt!
}
